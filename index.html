<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ProGineer Office Supplies</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
</head>
<body>
  <header class="topbar">
    <div class="container topbar-inner">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">P</span>
        <span class="brand-name">Office Supplies</span>
      </div>
      <span class="brand-team">ProGineer Technologies</span>
    </div>
  </header>

  <main class="container py-4">
    <section class="summary" aria-label="Inventory summary">
      <div class="metric">
        <span class="metric-value" id="statTotal">0</span>
        <span class="metric-label">items tracked</span>
      </div>
      <div class="metric metric-low">
        <span class="metric-value" id="statLow">0</span>
        <span class="metric-label">need restocking</span>
      </div>
      <div class="metric metric-out">
        <span class="metric-value" id="statOut">0</span>
        <span class="metric-label">out of stock</span>
      </div>
      <div class="metric">
        <span class="metric-value" id="statCategories">0</span>
        <span class="metric-label">categories</span>
      </div>
    </section>

    <div class="row g-4">
      <section class="col-xl-8" aria-labelledby="listHeading">
        <div class="panel">
          <div class="panel-head">
            <h1 class="panel-title" id="listHeading">Inventory</h1>
            <p class="panel-meta" id="resultCount" aria-live="polite"></p>
          </div>

          <form class="toolbar" role="search" onsubmit="return false">
            <div class="search-field">
              <label for="searchInput" class="visually-hidden">Search by item name</label>
              <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="9" cy="9" r="6"/><path d="m14 14 4 4"/></svg>
              <input type="search" id="searchInput" class="form-control" placeholder="Search items" autocomplete="off">
            </div>
            <label for="categoryFilter" class="visually-hidden">Category</label>
            <select id="categoryFilter" class="form-select category-select"></select>
            <div class="form-check form-switch toolbar-switch">
              <input class="form-check-input" type="checkbox" role="switch" id="lowStockOnly">
              <label class="form-check-label" for="lowStockOnly">Needs restocking</label>
            </div>
            <button type="button" id="resetFilters" class="btn-text">Clear filters</button>
          </form>

          <div class="table-responsive">
            <table class="inventory">
              <thead>
                <tr>
                  <th scope="col">Item</th>
                  <th scope="col">Category</th>
                  <th scope="col">In stock</th>
                  <th scope="col">Minimum</th>
                  <th scope="col">Status</th>
                  <th scope="col"><span class="visually-hidden">Actions</span></th>
                </tr>
              </thead>
              <tbody id="supplyBody"></tbody>
            </table>
          </div>
        </div>
      </section>

      <div class="col-xl-4 side">
        <section class="panel shopping" aria-labelledby="restockHeading">
          <div class="panel-head">
            <h2 class="panel-title" id="restockHeading">Shopping list</h2>
            <span class="count-pill" id="restockCount">0</span>
          </div>
          <ul class="shopping-list" id="restockList"></ul>
        </section>

        <section class="panel" aria-labelledby="formTitle">
          <h2 class="panel-title mb-3" id="formTitle">Add supply item</h2>
          <form id="supplyForm" novalidate>
            <div class="mb-3">
              <label for="name" class="form-label">Item name</label>
              <input type="text" id="name" class="form-control" maxlength="60" aria-describedby="nameError">
              <div class="invalid-feedback" id="nameError"></div>
            </div>
            <div class="mb-3">
              <label for="category" class="form-label">Category</label>
              <select id="category" class="form-select" aria-describedby="categoryError"></select>
              <div class="invalid-feedback" id="categoryError"></div>
            </div>
            <div class="row g-2 mb-3">
              <div class="col-4">
                <label for="quantity" class="form-label">Quantity</label>
                <input type="number" id="quantity" class="form-control" min="0" step="1" aria-describedby="quantityError">
                <div class="invalid-feedback" id="quantityError"></div>
              </div>
              <div class="col-4">
                <label for="minimum" class="form-label">Minimum</label>
                <input type="number" id="minimum" class="form-control" min="0" step="1" aria-describedby="minimumError">
                <div class="invalid-feedback" id="minimumError"></div>
              </div>
              <div class="col-4">
                <label for="unit" class="form-label">Unit</label>
                <select id="unit" class="form-select" aria-describedby="unitError"></select>
                <div class="invalid-feedback" id="unitError"></div>
              </div>
            </div>
            <div class="mb-3">
              <label for="supplier" class="form-label">Supplier <span class="optional">optional</span></label>
              <input type="text" id="supplier" class="form-control">
            </div>
            <div class="mb-4">
              <label for="notes" class="form-label">Notes <span class="optional">optional</span></label>
              <textarea id="notes" class="form-control" rows="2"></textarea>
            </div>
            <div class="d-flex gap-2">
              <button type="submit" id="submitButton" class="btn btn-primary flex-grow-1">Add item</button>
              <button type="button" id="cancelEdit" class="btn btn-light d-none">Cancel</button>
            </div>
          </form>
        </section>
      </div>
    </div>
  </main>

  <div id="messages" class="toast-area" aria-live="polite"></div>

  <script type="module" src="dist/main.js"></script>
</body>
</html>
