<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ProGineer Office Supply Management</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
</head>
<body class="bg-light">
  <header class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
      <span class="navbar-brand mb-0 h1">ProGineer Office Supplies</span>
      <span class="navbar-text small">Internal inventory</span>
    </div>
  </header>

  <main class="container pb-5">
    <div id="messages" class="messages" aria-live="polite"></div>

    <section class="row g-3 mb-4" aria-label="Inventory summary">
      <div class="col-6 col-md-3">
        <div class="card stat-card h-100"><div class="card-body">
          <div class="text-secondary small">Total items</div>
          <div class="fs-3 fw-bold" id="statTotal">0</div>
        </div></div>
      </div>
      <div class="col-6 col-md-3">
        <div class="card stat-card stat-warning h-100"><div class="card-body">
          <div class="text-secondary small">Need restocking</div>
          <div class="fs-3 fw-bold" id="statLow">0</div>
        </div></div>
      </div>
      <div class="col-6 col-md-3">
        <div class="card stat-card stat-danger h-100"><div class="card-body">
          <div class="text-secondary small">Out of stock</div>
          <div class="fs-3 fw-bold" id="statOut">0</div>
        </div></div>
      </div>
      <div class="col-6 col-md-3">
        <div class="card stat-card h-100"><div class="card-body">
          <div class="text-secondary small">Categories</div>
          <div class="fs-3 fw-bold" id="statCategories">0</div>
        </div></div>
      </div>
    </section>

    <div class="row g-4">
      <section class="col-lg-8" aria-labelledby="listHeading">
        <div class="card shadow-sm">
          <div class="card-body">
            <h1 class="h5 mb-3" id="listHeading">Supplies</h1>

            <form class="row g-2 align-items-end mb-3" role="search" onsubmit="return false">
              <div class="col-sm-5">
                <label for="searchInput" class="form-label small mb-1">Search by item name</label>
                <input type="search" id="searchInput" class="form-control" placeholder="e.g. coffee" autocomplete="off">
              </div>
              <div class="col-sm-4">
                <label for="categoryFilter" class="form-label small mb-1">Category</label>
                <select id="categoryFilter" class="form-select"></select>
              </div>
              <div class="col-sm-3">
                <button type="button" id="resetFilters" class="btn btn-outline-secondary w-100">Reset</button>
              </div>
              <div class="col-12">
                <div class="form-check form-switch">
                  <input class="form-check-input" type="checkbox" role="switch" id="lowStockOnly">
                  <label class="form-check-label" for="lowStockOnly">Show only items that need restocking</label>
                </div>
              </div>
            </form>

            <p class="text-secondary small mb-2" id="resultCount" aria-live="polite"></p>

            <div class="table-responsive">
              <table class="table table-hover align-middle mb-0">
                <thead>
                  <tr>
                    <th scope="col">Item</th>
                    <th scope="col">Category</th>
                    <th scope="col">Quantity</th>
                    <th scope="col">Unit</th>
                    <th scope="col">Minimum</th>
                    <th scope="col">Status</th>
                    <th scope="col"><span class="visually-hidden">Actions</span></th>
                  </tr>
                </thead>
                <tbody id="supplyBody"></tbody>
              </table>
            </div>
          </div>
        </div>
      </section>

      <aside class="col-lg-4" aria-labelledby="formTitle">
        <div class="card shadow-sm form-card">
          <div class="card-body">
            <h2 class="h5 mb-3" id="formTitle">Add supply item</h2>
            <form id="supplyForm" novalidate>
              <div class="mb-3">
                <label for="name" class="form-label">Item name</label>
                <input type="text" id="name" class="form-control" maxlength="60" aria-describedby="nameError">
                <div class="invalid-feedback" id="nameError"></div>
              </div>
              <div class="mb-3">
                <label for="category" class="form-label">Category</label>
                <select id="category" class="form-select" aria-describedby="categoryError"></select>
                <div class="invalid-feedback" id="categoryError"></div>
              </div>
              <div class="row g-2 mb-3">
                <div class="col-6">
                  <label for="quantity" class="form-label">Quantity</label>
                  <input type="number" id="quantity" class="form-control" min="0" step="1" aria-describedby="quantityError">
                  <div class="invalid-feedback" id="quantityError"></div>
                </div>
                <div class="col-6">
                  <label for="unit" class="form-label">Unit</label>
                  <select id="unit" class="form-select" aria-describedby="unitError"></select>
                  <div class="invalid-feedback" id="unitError"></div>
                </div>
              </div>
              <div class="mb-3">
                <label for="minimum" class="form-label">Minimum required quantity</label>
                <input type="number" id="minimum" class="form-control" min="0" step="1" aria-describedby="minimumError">
                <div class="invalid-feedback" id="minimumError"></div>
              </div>
              <div class="mb-3">
                <label for="supplier" class="form-label">Supplier <span class="text-secondary small">(optional)</span></label>
                <input type="text" id="supplier" class="form-control">
              </div>
              <div class="mb-3">
                <label for="notes" class="form-label">Notes <span class="text-secondary small">(optional)</span></label>
                <textarea id="notes" class="form-control" rows="2"></textarea>
              </div>
              <div class="d-flex gap-2">
                <button type="submit" id="submitButton" class="btn btn-primary">Add item</button>
                <button type="button" id="cancelEdit" class="btn btn-outline-secondary d-none">Cancel</button>
              </div>
            </form>
          </div>
        </div>
      </aside>
    </div>
  </main>

  <script type="module" src="dist/main.js"></script>
</body>
</html>
